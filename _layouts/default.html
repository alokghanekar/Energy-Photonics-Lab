<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a2a4a">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="author" content="{{ site.author | escape }}">
  <meta name="robots" content="{{ page.robots | default: 'index, follow' }}">

  {% assign page_title = page.title | default: site.title %}
  {% if page.title == "Home" %}
    <title>{{ site.title }} – UMBC</title>
  {% else %}
    <title>{{ page_title }} – {{ site.title }}</title>
  {% endif %}

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=7">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{% if page.title == 'Home' %}{{ site.title | escape }} – UMBC{% else %}{{ page_title | escape }} – {{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/social-card.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Energy Photonics Lab at UMBC">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title == 'Home' %}{{ site.title | escape }} – UMBC{% else %}{{ page_title | escape }} – {{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="twitter:image" content="{{ '/assets/images/social-card.png' | absolute_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ResearchOrganization",
    "name": "Energy Photonics Lab",
    "url": "{{ '/' | absolute_url }}",
    "description": {{ site.description | jsonify }},
    "parentOrganization": {
      "@type": "CollegeOrUniversity",
      "name": "University of Maryland, Baltimore County",
      "url": "https://umbc.edu/"
    },
    "founder": {
      "@type": "Person",
      "name": "Alok Ghanekar",
      "email": "mailto:{{ site.email }}"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include header.html %}
  <main id="main-content" class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
